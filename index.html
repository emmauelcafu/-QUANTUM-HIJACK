  <script>
    marked.use({
      mangle: false,
      headerIds: true
    });

    const sections = {
      readme: document.getElementById('md-readme').textContent,
      quickstart: document.getElementById('md-quickstart').textContent,
      checklist: document.getElementById('md-checklist').textContent,
    };

    function renderSection(key) {
      const content = sections[key] || '';
      const html = marked.parse(content);
      const container = document.getElementById('content');
      container.innerHTML = html;
      enhanceCheckboxes(key);
      // Checklist progress summary (always visible when checklist tab)
      const summary = document.getElementById('summary');
      if (key === 'checklist') {
        summary.hidden = false;
        renderChecklistProgress();
        ensureResetButton();
      } else {
        summary.hidden = true;
        summary.innerHTML = '';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function enhanceCheckboxes(sectionKey) {
      const container = document.getElementById('content');
      const boxes = container.querySelectorAll('input[type="checkbox"]');
      boxes.forEach((box, idx) => {
        const id = `${sectionKey}::cb::${idx}`;
        const saved = localStorage.getItem(id);
        if (saved !== null) box.checked = saved === '1';
        box.addEventListener('change', () => {
          localStorage.setItem(id, box.checked ? '1' : '0');
          if (sectionKey === 'checklist') renderChecklistProgress();
        });
      });
      if (sectionKey === 'checklist') annotateSectionHeadings();
    }

    function findNearestSectionHeading(el) {
      // Prefer h3 (sub-secciones); fallback a h2
      let cur = el;
      while (cur && cur !== document.getElementById('content')) {
        cur = cur.previousElementSibling || cur.parentElement;
        if (!cur) break;
        if (cur.tagName === 'H3') return { level: 3, name: cur.textContent.trim() };
        if (cur.tagName === 'H2') return { level: 2, name: cur.textContent.trim() };
      }
      return { level: 0, name: 'General' };
    }

    function computeChecklistProgress() {
      const container = document.getElementById('content');
      const boxes = Array.from(container.querySelectorAll('input[type="checkbox"]'));
      const sections = new Map();
      boxes.forEach(box => {
        const ctx = findNearestSectionHeading(box.closest('li') || box.parentElement || box);
        const key = ctx.name || 'General';
        if (!sections.has(key)) sections.set(key, { total: 0, checked: 0 });
        const agg = sections.get(key);
        agg.total += 1;
        if (box.checked) agg.checked += 1;
      });
      return sections;
    }

    function renderChecklistProgress() {
      const sections = computeChecklistProgress();
      const summary = document.getElementById('summary');
      const items = [];
      sections.forEach((agg, name) => {
        const pct = agg.total ? Math.round((agg.checked / agg.total) * 100) : 0;
        items.push(
          `<div class="section-item">
            <div>
              <div class="section-name">${name}</div>
              <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
            </div>
            <div class="counts">${agg.checked}/${agg.total} (${pct}%)</div>
          </div>`
        );
      });
      // Calcular total global
      const global = Array.from(sections.values()).reduce((a,b)=>({checked:a.checked+b.checked,total:a.total+b.total}),{checked:0,total:0});
      const gpct = global.total ? Math.round((global.checked/global.total)*100) : 0;
      const globalBar = `<div style="margin-bottom:16px;padding:12px;border:1px solid #1e40af;border-radius:8px;background:#0c1e3d;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
          <span style="color:#e5e7eb;font-weight:600;">✅ Progreso Global Total</span>
          <span style="color:#3b82f6;font-weight:bold;">${global.checked}/${global.total} (${gpct}%)</span>
        </div>
        <div class="progress" style="height:14px;border-color:#1e40af;"><div class="bar" style="width:${gpct}%;background:linear-gradient(90deg,#3b82f6,#60a5fa);"></div></div>
      </div>`;
      summary.innerHTML = `<h2 class="summary-title">Progreso del Checklist</h2>${globalBar}<div style="margin-top:12px;font-size:13px;color:#9ca3af;font-weight:600;margin-bottom:8px;">Por sección:</div>${items.join('')}`;
      annotateSectionHeadings(sections);
    }

    function ensureResetButton() {
      const summary = document.getElementById('summary');
      if (!summary) return;
      if (summary.querySelector('#btn-reset-checklist')) return;
      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.style.justifyContent = 'flex-end';
      wrap.style.marginTop = '12px';
      const btn = document.createElement('button');
      btn.id = 'btn-reset-checklist';
      btn.textContent = 'Reset progreso del checklist';
      btn.style.border = '1px solid #374151';
      btn.style.background = '#111827';
      btn.style.color = '#e5e7eb';
      btn.style.padding = '6px 10px';
      btn.style.borderRadius = '8px';
      btn.style.cursor = 'pointer';
      btn.addEventListener('click', () => {
        // Limpiar solo claves de checklist
        const keys = Object.keys(localStorage);
        keys.forEach(k => { if (k.startsWith('checklist::cb::')) localStorage.removeItem(k); });
        renderSection('checklist');
      });
      wrap.appendChild(btn);
      summary.appendChild(wrap);
    }

    function annotateSectionHeadings(sectionsMap) {
      const container = document.getElementById('content');
      const headings = container.querySelectorAll('h3');
      const sections = sectionsMap || computeChecklistProgress();
      headings.forEach(h => {
        const name = h.textContent.trim();
        const agg = sections.get(name);
        const pct = agg && agg.total ? Math.round((agg.checked / agg.total) * 100) : 0;
        let badge = h.querySelector('.heading-progress');
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'heading-progress';
          h.appendChild(badge);
        }
        badge.textContent = agg ? `${agg.checked}/${agg.total} (${pct}%)` : `0/0 (0%)`;
      });
    }

    document.querySelectorAll('nav button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
        renderSection(btn.dataset.target);
      });
    });

    // Render inicial
    renderSection('readme');
  </script>
